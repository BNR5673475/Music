<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Music Player</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-wrapper">
        <div class="sidebar-left">
            <div class="logo-container">
                <svg class="logo-icon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                </svg>
                <span>MyMusic</span>
            </div>
            
            <div class="sidebar-menu">
                <div class="menu-item active" id="nav-library">📚 Your Library</div>
                <div class="menu-item" id="btn-new-playlist">➕ New Playlist</div>
            </div>
            
            <div class="sidebar-header">PLAYLISTS</div>
            <ul id="sidebar-playlists" class="custom-playlists">
                </ul>

            <div style="flex-grow: 1;"></div> <div id="drop-zone">
                <h3>Drag & Drop</h3>
                <p>Add MP3s</p>
                <input type="file" id="file-input" accept="audio/*" multiple>
            </div>
            <button class="clear-btn" id="clear-db-btn">🗑️ Clear Saved Library</button>
        </div>

        <div class="main-center">
            <div class="queue-header" id="main-view-title">Your Library</div>
            <ul id="playlist"></ul> </div>

        <div class="sidebar-right">
            <div class="about-header">About Song</div>
            <img id="about-cover" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' background='%23282828'><rect width='100%' height='100%' fill='%23282828'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='40' fill='%23b3b3b3'>🎵</text></svg>">
            <div id="about-title">No track playing</div>
            <div id="about-artist">-</div>
        </div>
    </div>

    <div class="player-bar">
        <div class="now-playing">
            <img id="mini-cover" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' background='%23282828'><rect width='100%' height='100%' fill='%23282828'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='40' fill='%23b3b3b3'>🎵</text></svg>">
            <div class="current-text">
                <div id="mini-title">No track selected</div>
                <div id="mini-artist">-</div>
            </div>
        </div>
        
        <div class="player-controls">
            <div class="control-buttons">
                <button class="icon-btn" id="shuffle-btn"><svg role="img" height="16" width="16" viewBox="0 0 16 16"><path fill="currentColor" d="M13.151.922a.75.75 0 1 0-1.06 1.06L13.109 3H11.16a3.75 3.75 0 0 0-2.873 1.34l-6.173 7.356A2.25 2.25 0 0 1 3.84 12.5H1.5a.75.75 0 0 0 0 1.5h2.34a3.75 3.75 0 0 0 2.873-1.34l6.173-7.356a2.25 2.25 0 0 1 1.724-.804h1.947l-1.017 1.018a.75.75 0 0 0 1.06 1.06L15.98 4.5l-2.83-3.578zM2.25 3.5a.75.75 0 0 0 0 1.5h1.59a2.25 2.25 0 0 1 1.724.804l.113.135a.75.75 0 0 0 1.15-.966l-.113-.135A3.75 3.75 0 0 0 3.84 3.5H2.25zm7.39 6.81a.75.75 0 0 0-1.15.966l.113.135a3.75 3.75 0 0 0 2.873 1.34h1.947l-1.017 1.018a.75.75 0 0 0 1.06 1.06L15.98 11.5l-2.83-3.578a.75.75 0 1 0-1.06 1.06l1.017 1.018H11.16a2.25 2.25 0 0 1-1.724-.804l-.113-.135z"></path></svg></button>
                <button class="icon-btn" id="prev-btn"><svg role="img" height="16" width="16" viewBox="0 0 16 16"><path fill="currentColor" d="M3.3 1a.7.7 0 0 1 .7.7v5.15l9.95-5.744a.7.7 0 0 1 1.05.606v12.575a.7.7 0 0 1-1.05.607L4 9.149v5.15a.7.7 0 0 1-.7.7H1.7a.7.7 0 0 1-.7-.7V1.7a.7.7 0 0 1 .7-.7h1.6z"></path></svg></button>
                <button class="play-pause-btn" id="play-pause-btn">
                    <svg id="play-icon" role="img" height="16" width="16" viewBox="0 0 16 16"><path fill="currentColor" d="M3 1.713a.7.7 0 0 1 1.05-.607l10.89 6.288a.7.7 0 0 1 0 1.212L4.05 14.894A.7.7 0 0 1 3 14.288V1.713z"></path></svg>
                    <svg id="pause-icon" style="display: none;" role="img" height="16" width="16" viewBox="0 0 16 16"><path fill="currentColor" d="M2.7 1a.7.7 0 0 0-.7.7v12.6a.7.7 0 0 0 .7.7h2.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7H2.7zm8 0a.7.7 0 0 0-.7.7v12.6a.7.7 0 0 0 .7.7h2.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7h-2.6z"></path></svg>
                </button>
                <button class="icon-btn" id="next-btn"><svg role="img" height="16" width="16" viewBox="0 0 16 16"><path fill="currentColor" d="M12.7 1a.7.7 0 0 0-.7.7v5.15L2.05 1.107A.7.7 0 0 0 1 1.712v12.575a.7.7 0 0 0 1.05.607L12 9.149v5.15a.7.7 0 0 0 .7.7h1.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7h-1.6z"></path></svg></button>
                <button class="icon-btn" title="Repeat"><svg role="img" height="16" width="16" viewBox="0 0 16 16"><path fill="currentColor" d="M0 4.75A3.75 3.75 0 0 1 3.75 1h8.5A3.75 3.75 0 0 1 16 4.75v5a3.75 3.75 0 0 1-3.75 3.75H9.81l1.018 1.018a.75.75 0 1 1-1.06 1.06L6.939 12.75l2.829-2.828a.75.75 0 1 1 1.06 1.06L9.811 12h2.439a2.25 2.25 0 0 0 2.25-2.25v-5a2.25 2.25 0 0 0-2.25-2.25h-8.5A2.25 2.25 0 0 0 1.5 4.75v5A2.25 2.25 0 0 0 3.75 12H5v1.5H3.75A3.75 3.75 0 0 1 0 9.75v-5z"></path></svg></button>
            </div>
            
            <div class="playback-bar">
                <span id="current-time" class="time-display">0:00</span>
                <div class="progress-container">
                    <input type="range" id="progress-bar" min="0" max="100" value="0" step="0.1">
                </div>
                <span id="total-time" class="time-display">0:00</span>
            </div>
        </div>
        <div class="right-controls">
            <button class="icon-btn" id="mute-btn" title="Mute">
                <svg id="vol-icon" role="img" height="16" width="16" viewBox="0 0 16 16"><path fill="currentColor" d="M9.741.85a.75.75 0 0 1 .375.65v13a.75.75 0 0 1-1.125.65l-6.925-4a3.642 3.642 0 0 1-1.33-4.967 3.639 3.639 0 0 1 1.33-1.325l6.925-4a.75.75 0 0 1 .75 0zm-6.924 5.3a2.139 2.139 0 0 0-1.05 1.85 2.14 2.14 0 0 0 1.05 1.85l6.425 3.71V2.44L2.817 6.15zM13 8a5 5 0 0 1-1.745 3.795.75.75 0 0 0 1.01 1.11A6.499 6.499 0 0 0 14.5 8a6.5 6.5 0 0 0-2.235-4.905.75.75 0 0 0-1.01 1.11A5 5 0 0 1 13 8zm-2.095 1.922a2.5 2.5 0 0 0 0-3.844.75.75 0 1 0-.96.96 1 1 0 0 1 0 1.924.75.75 0 1 0 .96.96z"></path></svg>
                <svg id="mute-icon" style="display: none;" role="img" height="16" width="16" viewBox="0 0 16 16"><path fill="currentColor" d="M13.86 5.47a.75.75 0 0 0-1.061 0l-1.47 1.47-1.47-1.47A.75.75 0 0 0 8.8 6.53L10.269 8l-1.47 1.47a.75.75 0 1 0 1.06 1.06l1.47-1.47 1.47 1.47a.75.75 0 0 0 1.06-1.06L12.39 8l1.47-1.47a.75.75 0 0 0 0-1.06zM9.741.85a.75.75 0 0 1 .375.65v13a.75.75 0 0 1-1.125.65l-6.925-4a3.642 3.642 0 0 1-1.33-4.967 3.639 3.639 0 0 1 1.33-1.325l6.925-4a.75.75 0 0 1 .75 0zm-6.924 5.3a2.139 2.139 0 0 0-1.05 1.85 2.14 2.14 0 0 0 1.05 1.85l6.425 3.71V2.44L2.817 6.15z"></path></svg>
            </button>
            <div class="volume-container">
                <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="1">
            </div>
        </div>
    </div>

    <div id="playlist-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>Add to Playlist</h3>
            <ul id="modal-playlist-options"></ul>
            <button class="close-modal" id="close-modal-btn">Cancel</button>
        </div>
    </div>

    <audio id="audio-player"></audio>
    <script src="app.js"></script>
</body>
</html>
